[project]
name = "retail"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["numpy", "opencv-python-headless", "fastapi", "uvicorn", "pyyaml", "scipy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning"]

[tool.setuptools]
packages = ["core", "pl", "sources", "geometry", "backend"]
